name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The package declares `engines.node: ">=22"`.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      # `vitest` does not typecheck, so `npm test` alone lets type errors through.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Everything above must pass before anything can be published.
      - name: Verify the package can be packed
        run: npm pack --dry-run
